<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:0;background:var(--tg-theme-secondary-bg-color,#18222d);color:var(--tg-theme-text-color,#f5f7fa);font:14px system-ui}.game{padding:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-weight:800;font-size:17px;letter-spacing:.3px}.score{background:var(--tg-theme-section-bg-color,#243447);padding:7px 12px;border-radius:12px;font-weight:700}.score b{color:var(--tg-theme-accent-text-color,#64b5ef)}canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#101b27;border:1px solid #34485b;border-radius:15px;touch-action:none}.hint{text-align:center;color:var(--tg-theme-hint-color,#9aabba);font-size:12px;margin:8px 0 10px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:220px;margin:auto}.controls button,.action{border:0;border-radius:12px;background:var(--tg-theme-section-bg-color,#2b3d50);color:var(--tg-theme-text-color,#fff);font:700 19px system-ui;height:42px}.controls button:active,.action:active{filter:brightness(1.25)}.controls .empty{visibility:hidden}.bottom{display:flex;gap:8px;margin-top:10px}.action{height:38px;flex:1;font-size:13px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}.action.alt{background:var(--tg-theme-section-bg-color,#2b3d50);color:var(--tg-theme-text-color,#fff)}.note{text-align:center;color:var(--tg-theme-hint-color,#9aabba);font-size:11px;margin-top:8px}
</style><div class="game"><div class="top"><div class="brand">SNAKE <span style="color:#55d68b">///</span></div><div class="score">SCORE&nbsp; <b id="score">0</b></div></div><canvas id="board" width="300" height="300"></canvas><div class="hint" id="hint">Eat the glowing orbs. Don't bite yourself.</div><div class="controls"><span class="empty"></span><button onclick="turn(0,-1)">▲</button><span class="empty"></span><button onclick="turn(-1,0)">◀</button><button onclick="turn(0,1)">▼</button><button onclick="turn(1,0)">▶</button></div><div class="bottom"><button class="action" id="pause" onclick="togglePause()">PAUSE</button><button class="action alt" onclick="restart()">RESTART</button></div><div class="note">Swipe the board or use the arrows</div></div><script>
(function(){
const c=document.getElementById('board'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),hint=document.getElementById('hint'),pauseBtn=document.getElementById('pause'),N=15,S=20;
let snake,food,dir,next,score,alive,paused,last=0,acc=0;
function rand(){return Math.floor(Math.random()*N)}
function place(){do{food={x:rand(),y:rand()}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function restart(){snake=[{x:7,y:8},{x:6,y:8},{x:5,y:8}];dir={x:1,y:0};next={x:1,y:0};score=0;alive=true;paused=false;acc=0;scoreEl.textContent='0';hint.textContent="Eat the glowing orbs. Don't bite yourself.";pauseBtn.textContent='PAUSE';place();draw()}
function turn(a,b){if(!alive||a===-dir.x&&b===-dir.y)return;next={x:a,y:b}}
function togglePause(){if(!alive)return;paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';hint.textContent=paused?'Take a breather.':"Eat the glowing orbs. Don't bite yourself."}
function end(){alive=false;hint.textContent='Game over · '+score+' points. Tap RESTART to go again.';pauseBtn.textContent='GAME OVER'}
function step(){dir=next;const h={x:(snake[0].x+dir.x+N)%N,y:(snake[0].y+dir.y+N)%N},eat=h.x===food.x&&h.y===food.y;if(snake.some((p,i)=>p.x===h.x&&p.y===h.y&&(eat||i<snake.length-1))){end();return}snake.unshift(h);if(eat){score+=10;scoreEl.textContent=score;place()}else snake.pop()}
function draw(){x.clearRect(0,0,300,300);x.fillStyle='#101b27';x.fillRect(0,0,300,300);x.strokeStyle='rgba(130,165,190,.08)';for(let i=1;i<N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,300);x.moveTo(0,i*S);x.lineTo(300,i*S);x.stroke()}x.shadowColor='#ffbd59';x.shadowBlur=14;x.fillStyle='#ffbd59';x.beginPath();x.arc(food.x*S+10,food.y*S+10,6,0,Math.PI*2);x.fill();x.shadowBlur=0;snake.forEach((p,i)=>{x.fillStyle=i?'#28a96b':'#67f0a5';x.beginPath();x.roundRect(p.x*S+1,p.y*S+1,18,18,i?5:7);x.fill()});if(!alive){x.fillStyle='rgba(5,12,19,.65)';x.fillRect(0,0,300,300);x.fillStyle='#fff';x.textAlign='center';x.font='bold 22px system-ui';x.fillText('GAME OVER',150,145);x.font='14px system-ui';x.fillText('Score: '+score,150,170)}}
function frame(t){if(!last)last=t;let dt=Math.min(t-last,100);last=t;if(alive&&!paused){acc+=dt;let speed=Math.max(75,145-score/5);while(acc>=speed){step();acc-=speed}draw()}requestAnimationFrame(frame)}
let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1)});
window.turn=turn;window.togglePause=togglePause;window.restart=restart;restart();requestAnimationFrame(frame);
})();
</script>
